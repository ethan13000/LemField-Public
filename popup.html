<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LemField</title><link rel="stylesheet" href="popup.css"></head>
<body><header><strong>LemField</strong><span id="status">Feature controls</span></header>
<main><section aria-label="Features">
<label class="feature"><span><strong>Deck requirements</strong><small>Show the requirements panel on decks</small></span><input type="checkbox" data-feature="requirements"></label>
<label class="feature"><span><strong>EDHREC recommendations</strong><small>Browse card recommendations</small></span><input type="checkbox" data-feature="edhrec"></label>
<label class="feature"><span><strong>Printing shortcuts</strong><small>Show printing tools on cards</small></span><input type="checkbox" data-feature="printing"></label>
<label class="feature"><span><strong>Scryfall add to deck</strong><small>Add cards from Scryfall pages</small></span><input type="checkbox" data-feature="scryfall"></label>
<label class="feature"><span><strong>Requirements sidebar</strong></span><input type="checkbox" data-feature="sidebar"></label><label class="feature"><span><strong>Card Explorer</strong></span><input type="checkbox" data-feature="explorer"></label><label class="feature"><span><strong>Exclude cards already in this deck</strong></span><input type="checkbox" data-feature="deckSearch"></label><label class="feature"><span><strong>Deck printing</strong></span><input type="checkbox" data-feature="pdf"></label><label class="feature"><span><strong>Highlight LemField features in orange</strong></span><input type="checkbox" data-feature="highlight"></label><label class="feature"><span><strong>Quick add from search</strong><small>Add search results to your last deck</small></span><input type="checkbox" data-feature="searchAdd"></label><label class="feature"><span><strong>Background role search</strong><small>Find 50 cards per deck requirement without loading artwork</small></span><input type="checkbox" data-feature="prefetchRoles"></label></section><div class="print-action"><button id="export-pdf" type="button"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M6 14h12v7H6zM18 12h.01"/></svg><span>Print / PDF</span></button><small>Print card sheets from your current deck</small></div><div id="message" role="status"></div></main>
<section class="sync-settings" aria-label="Print settings sync"><h2>Print settings</h2><p id="sync-status" role="status">Checking browser sync?</p><div class="sync-actions"><button id="sync-now" type="button">Check sync</button><button id="export-settings" type="button">Export</button><button id="import-settings" type="button">Import</button></div><input id="import-settings-file" type="file" accept=".json,application/json" hidden><p>Sync uses your browser account. Exports include printing selections and token quantities; uploaded images stay on this device.</p></section>
<script src="browser-compat.js"></script><script src="popup.js"></script></body></html>
